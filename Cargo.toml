[package]
name = "puzzler"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A fast exact-cover solver for polyomino / jigsaw puzzles defined in .pzle (YAML) files"
license = "MIT"
repository = "https://github.com/HFunction2013/puzzler"
readme = "README.md"
homepage = "https://github.com/HFunction2013/puzzler"
keywords = ["puzzle", "polyomino", "exact-cover", "solver", "jigsaw"]
categories = ["games", "algorithms"]

[[bin]]
name = "puzzler"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
